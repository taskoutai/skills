name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # setup-python has no 3.9 build for current ubuntu-latest; uv provides one.
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.9
      - run: uv run --no-project --python 3.9 python scripts/validate_skills.py
      - run: uv run --no-project --python 3.9 --with pytest python -m pytest -q tests
  skills-gepa:
    # judge-builder and playbook-eval need Python 3.10+; this runs the GEPA tests that skip on 3.9.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 -m pip install --quiet pytest "gepa==0.1.4" "anthropic>=2.6"
      - run: python3 -m pytest -q tests
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Scans the full history; fails the job on any finding.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
